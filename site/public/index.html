<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="钛唇工作室主页，发布原创中文音乐、音乐视频与系列作品。"
    >
    <title>钛唇工作室 | Titan Lips Studio</title>
    <link rel="preload" href="/assets/brand/stage-bg.jpg" as="image">
    <link rel="preload" href="/assets/brand/TitanLogo.png" as="image">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand-link" href="/" aria-label="钛唇工作室首页">
        <img src="/assets/brand/TitanLogo.png" alt="钛唇工作室" class="brand-mark">
        <span>钛唇工作室</span>
      </a>
      <nav class="top-nav" aria-label="主要导航">
        <a href="#series">作品系列</a>
        <a href="#catalog">全部视频</a>
        <a href="#channels">频道</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">Titan Lips Studio</p>
          <h1 id="hero-title">钛唇工作室</h1>
          <p class="hero-line">在废墟里唱苦闷，在梦境里留温柔。</p>
          <div class="hero-actions">
            <a href="#series">浏览作品系列</a>
            <a href="#catalog">查看全部视频</a>
          </div>
        </div>
        <div class="hero-index" aria-label="作品概览">
          <span>5 个系列</span>
          <span>10 支视频</span>
          <span>YouTube / Bilibili</span>
        </div>
      </section>

      <section class="control-strip" aria-label="播放平台">
        <p id="region-copy">正在选择适合你的播放平台。</p>
        <div class="platform-toggle" role="group" aria-label="播放平台">
          <button class="platform-button" type="button" data-platform="youtube">YouTube</button>
          <button class="platform-button" type="button" data-platform="bilibili">Bilibili</button>
        </div>
      </section>

      <section class="series-section" id="series" aria-labelledby="series-title">
        <div class="section-heading">
          <p class="eyebrow">Series Shelves</p>
          <h2 id="series-title">作品系列</h2>
        </div>
        <div class="series-shelves" id="series-shelves"></div>
      </section>

      <section class="catalog-section" id="catalog" aria-labelledby="catalog-title">
        <div class="section-heading">
          <p class="eyebrow">Video Index</p>
          <h2 id="catalog-title">全部视频</h2>
        </div>
        <div class="compact-list" id="compact-list"></div>
      </section>

      <section class="channels-section" id="channels" aria-labelledby="channels-title">
        <div class="section-heading">
          <p class="eyebrow">Channels</p>
          <h2 id="channels-title">收听与关注</h2>
        </div>
        <div class="channel-links">
          <a href="https://www.youtube.com/@%E9%92%9B%E5%94%87" rel="noreferrer" target="_blank">
            <span>YouTube</span>
            <strong>@钛唇</strong>
          </a>
          <a href="https://space.bilibili.com/3706968275421396" rel="noreferrer" target="_blank">
            <span>Bilibili</span>
            <strong>钛唇工作室</strong>
          </a>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
