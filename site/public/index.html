<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="钛唇工作室主页，发布原创中文音乐、音乐视频与系列作品。"
    >
    <title>钛唇工作室 | Titan Lips Studio</title>
    <link rel="preload" href="/assets/brand/TitanLogo.png" as="image">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand-link" href="/" aria-label="钛唇工作室首页">
        <img src="/assets/brand/TitanLogo.png" alt="钛唇工作室" class="brand-mark">
      </a>
      <nav class="top-nav" aria-label="主要导航">
        <a href="#series">系列</a>
        <a href="#videos">音乐视频</a>
        <a href="#channels">频道</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">Titan Lips Studio</p>
          <h1 id="hero-title">钛唇工作室</h1>
          <p class="hero-line">原创中文音乐，暗色叙事，粉色电光。</p>
          <div class="hero-actions" aria-label="频道链接">
            <a href="https://www.youtube.com/@%E9%92%9B%E5%94%87" rel="noreferrer" target="_blank">YouTube</a>
            <a href="https://space.bilibili.com/3706968275421396" rel="noreferrer" target="_blank">Bilibili</a>
          </div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <img src="/assets/brand/TitanLogo.png" alt="">
        </div>
      </section>

      <section class="listen-panel" aria-labelledby="player-title">
        <div class="section-heading">
          <p class="eyebrow">Now Playing</p>
          <h2 id="player-title">音乐视频</h2>
        </div>

        <div class="platform-row">
          <p id="region-copy">正在选择适合你的播放平台。</p>
          <div class="platform-toggle" role="group" aria-label="播放平台">
            <button class="platform-button" type="button" data-platform="youtube">YouTube</button>
            <button class="platform-button" type="button" data-platform="bilibili">Bilibili</button>
          </div>
        </div>

        <div class="player-layout">
          <div class="video-frame" id="video-frame">
            <iframe
              id="video-player"
              title="音乐视频播放器"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            ></iframe>
            <div class="player-fallback" id="player-fallback" hidden>
              <p>这首歌的 Bilibili 嵌入链接还没有录入。</p>
              <a href="https://space.bilibili.com/3706968275421396" rel="noreferrer" target="_blank">打开钛唇工作室 Bilibili 频道</a>
            </div>
          </div>
          <div class="track-info">
            <p class="series-label" id="active-series"></p>
            <h3 id="active-title"></h3>
            <p id="active-description"></p>
            <div class="track-links">
              <a id="youtube-link" rel="noreferrer" target="_blank">YouTube</a>
              <a id="bilibili-link" rel="noreferrer" target="_blank">Bilibili</a>
            </div>
          </div>
        </div>
      </section>

      <section class="series-section" id="series" aria-labelledby="series-title">
        <div class="section-heading">
          <p class="eyebrow">Series</p>
          <h2 id="series-title">作品系列</h2>
        </div>
        <div class="series-grid" id="series-grid"></div>
      </section>

      <section class="videos-section" id="videos" aria-labelledby="videos-title">
        <div class="section-heading">
          <p class="eyebrow">Catalog</p>
          <h2 id="videos-title">全部视频</h2>
        </div>
        <div class="video-grid" id="video-grid"></div>
      </section>

      <section class="channels-section" id="channels" aria-labelledby="channels-title">
        <div class="section-heading">
          <p class="eyebrow">Channels</p>
          <h2 id="channels-title">收听与关注</h2>
        </div>
        <div class="channel-links">
          <a href="https://www.youtube.com/@%E9%92%9B%E5%94%87" rel="noreferrer" target="_blank">
            <span>YouTube</span>
            <strong>@钛唇</strong>
          </a>
          <a href="https://space.bilibili.com/3706968275421396" rel="noreferrer" target="_blank">
            <span>Bilibili</span>
            <strong>钛唇工作室</strong>
          </a>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
